name: companye-tests
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: companye
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: postgres
    volumes:
      - ./generated:/seed:ro
      - ./generated/v1/load.sql:/docker-entrypoint-initdb.d/01-companye.sql:ro
      - ./generated/v2/load.sql:/docker-entrypoint-initdb.d/02-companye-v2.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companye -d entertainment_ops_v2 && psql -U companye -d entertainment_ops_v2 -Atc 'SELECT count(*) FROM cash_events' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 1g
  tester:
    image: companye-tests:py311-spark357-gx124
    build:
      context: ./testing
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      COMPANYE_TEST_DSN: postgresql://companye:isolated-test-only@postgres-test:5432
      COMPANYE_TEST_OUTPUT: /test-output
    volumes:
      - .:/workspace:ro
      - ./reports/testing:/test-output
    mem_limit: 4g
