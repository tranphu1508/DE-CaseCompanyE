[pytest]
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    v2: multi-item procurement, deliveries, profile ambiguity and revisions
    coverage: scenario coverage and declared generator gaps
    baseline: immutable v1 and deterministic regeneration
    source: PostgreSQL integration in isolated test service
    property: randomized generator invariants
    spark: Spark transformations and recovery
    lake: full isolated lake integration and catalog persistence
    gx: Great Expectations compatibility and validation
    acceptance: independent business acceptance examples, not a deployed warehouse
