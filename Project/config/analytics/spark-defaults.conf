# Dependency JARs are verified by analytics_runtime/install_jars.py.
# Catalog credentials are read from Docker secrets by analytics_runtime/session.py.
spark.master local[2]
spark.driver.memory 2g
spark.local.dir /analytics/spark-local
spark.jars.ivy /analytics/ivy
spark.sql.session.timeZone UTC
spark.sql.timestampType TIMESTAMP_NTZ
spark.sql.ansi.enabled true
spark.sql.decimalOperations.allowPrecisionLoss false
spark.sql.shuffle.partitions 8
spark.default.parallelism 2
spark.sql.adaptive.enabled true
spark.sql.files.ignoreMissingFiles false
spark.sql.files.ignoreCorruptFiles false
spark.sql.parquet.outputTimestampType TIMESTAMP_MICROS
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.ce org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.ce.type jdbc
spark.sql.catalog.ce.uri jdbc:postgresql://metadata:5432/ce_metadata?currentSchema=iceberg_catalog
spark.sql.catalog.ce.warehouse file:///analytics/iceberg
spark.sql.catalog.ce.cache-enabled false
spark.eventLog.enabled true
spark.eventLog.dir file:///analytics/events
# No cached DataFrames/CACHE TABLE in measured baseline queries.
